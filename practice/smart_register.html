<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm</title>
    <link rel="stylesheet" href="smart_register.css">
    <link rel="icon" href="../accerts/images/logo/smart_form.png">

</head>
<body>
<!-- SignUp Form -->
    <div id="signup" class="signup-box">
        <a href="smart_home1.html" class="close">&times;</a>
        <h2>SignUp</h2>

        <form id="signupForm" action="smart_login.html" method="get"><br>

        <!-- Full Name -->
            <h3>Sign-Up for Smart Farm</h3>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>

        <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>

        <!-- Phone Number -->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
 
        <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
        <!-- Confirm Password -->
            <label for="conformpassword">Confirm Password:</label>
            <input type="password" id="conformpassword" name="conformpassword" placeholder="Confirm Password" required>
         

        <!-- Remember Me -->
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Agree to Terms & Conditions</label><br>


        <!-- SignUp Button -->
            <button type="submit">Sign-Up</button><br>

        <!-- Login Link -->
            <p>Already have an account.? <a href="smart_login.html">Login here.</a>
        </form>
    </div>
    
</body>
</html>

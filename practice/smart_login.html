<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm</title>
    <link rel="stylesheet" href="smart_login.css">    
    <link rel="icon" href="../accerts/images/logo/smart_form.png">

</head>
<body>
<!-- Login Form -->
    <div id="login" class="login-box">
        <a href="smart_home1.html" class="close">&times;</a>
        <h2>Login</h2>

        <form id="loginForm" action="smart_home2.html" method="get"><br>

        <!-- Username -->
            <h3>Login to Smart Farm</h3>
            <!-- <label for="username">Username:</label><br> -->
            <input type="text" id="username" name="username" placeholder="Username" required>

        <!-- Password -->
            <!-- <label for="password">Password:</label> -->
            <input type="password" id="password" name="password" placeholder="Password" required><br>

        <!-- Remember Me -->
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember Me</label><br>

        <!-- Login Button -->
            <button type="submit">Login</button><br>

        <!-- Forgot Password -->
            <a href="#">Forgot Password.?</a>
            <p>Create Account?<a href="smart_register.html"> Register here.</a></p>
            
        </form>
    </div>
    
</body>
</html>
